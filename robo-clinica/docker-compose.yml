services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=evolution
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${EVOLUTION_DB_PASSWORD}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  evolution-api:
    # v2.3.7 pinada de propósito: a partir da v2.4.0 a Evolution API passou a
    # exigir "ativação de licença" (gratuita, mas depende de um servidor
    # externo deles). Pra um MVP simples, evitamos essa dependência a mais.
    image: evoapicloud/evolution-api:v2.3.7
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_DB_PASSWORD}@postgres:5432/evolution?schema=public
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
    volumes:
      - evolution_data:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "3333:3333"
    env_file: .env
    volumes:
      - backend_db:/app/prisma
    depends_on:
      - evolution-api
    restart: unless-stopped

volumes:
  evolution_data:
  evolution_postgres_data:
  backend_db:
